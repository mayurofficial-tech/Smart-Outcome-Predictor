<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3b"/>
      <stop offset="1" stop-color="#3a1c71"/>
    </linearGradient>
  </defs>

  <rect width="900" height="290" rx="16" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect x="620" y="30" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="720" y="60" width="3" height="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="840" y="36" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="880" y="100" width="3" height="3"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></rect>
  </g>

  <!-- text -->
  <text x="40" y="52" font-family="Courier New, monospace" font-size="13" fill="#ffd60a" letter-spacing="5">PLAYER 1 · STUDENT · PRESS START</text>
  <text x="40" y="96" font-family="Courier New, monospace" font-size="38" font-weight="bold" fill="#ffffff">Smart Outcome Predictor</text>
  <text x="40" y="132" font-family="Courier New, monospace" font-size="15" fill="#c9b6ff">Will the student finish? What will they score?</text>

  <!-- score bar -->
  <text x="580" y="152" font-family="Courier New, monospace" font-size="12" fill="#ffd60a" letter-spacing="2">FINAL SCORE  0 → 100</text>
  <rect x="580" y="160" width="260" height="14" rx="3" fill="none" stroke="#ffd60a" stroke-width="2"/>
  <rect x="583" y="163" width="0" height="8" fill="#38b000">
    <animate attributeName="width" values="0;254;254;0" keyTimes="0;0.8;0.95;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- level complete -->
  <text x="710" y="196" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#ffd60a" opacity="0">
    LEVEL COMPLETE ★
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- ground -->
  <rect x="0" y="236" width="900" height="54" fill="#2d1b69"/>
  <g fill="#4b2fa0">
    <rect x="0" y="236" width="60" height="10"/><rect x="90" y="236" width="60" height="10"/>
    <rect x="180" y="236" width="60" height="10"/><rect x="270" y="236" width="60" height="10"/>
    <rect x="360" y="236" width="60" height="10"/><rect x="450" y="236" width="60" height="10"/>
    <rect x="540" y="236" width="60" height="10"/><rect x="630" y="236" width="60" height="10"/>
    <rect x="720" y="236" width="60" height="10"/><rect x="810" y="236" width="60" height="10"/>
  </g>

  <!-- coins -->
  <g fill="#ffd60a">
    <circle cx="140" cy="190" r="6"><animate attributeName="r" values="6;3;6" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="6"><animate attributeName="r" values="6;3;6" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="190" r="6"><animate attributeName="r" values="6;3;6" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- flag -->
  <rect x="800" y="150" width="4" height="86" fill="#e0e0e0"/>
  <polygon points="804,150 840,164 804,178" fill="#38b000"/>

  <!-- hopping player -->
  <g>
    <animateMotion path="M0,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0 q40,-55 80,0" dur="6s" repeatCount="indefinite"/>
    <g transform="translate(60 236)">
      <rect x="-11" y="-24" width="22" height="24" fill="#4cc9f0"/>
      <rect x="-6" y="-18" width="4" height="4" fill="#0d1b2a"/>
      <rect x="3" y="-18" width="4" height="4" fill="#0d1b2a"/>
      <rect x="-11" y="-30" width="22" height="6" fill="#ffd60a"/>
    </g>
  </g>
</svg>
